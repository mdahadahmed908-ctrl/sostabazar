<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>সস্তা বাজার</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}
header{
background:#0a7d34;
color:white;
padding:15px;
text-align:center;
}
.hero{
padding:30px;
text-align:center;
}
button{
background:#ff9800;
color:white;
border:none;
padding:12px 25px;
font-size:18px;
border-radius:8px;
}
</style>

</head>
<body>

<header>
<h1>🛒 সস্তা বাজার</h1>
<p>সব ধরনের পণ্য এক জায়গায়</p>
</header>

<div class="hero">
<h2>স্বাগতম!</h2>
<p>খুব শীঘ্রই আমাদের অনলাইন শপ চালু হচ্ছে।</p>
<button>এখনই কেনাকাটা করুন</button>
</div>
<section class="products">
<h2>আমাদের পণ্য</h2>

<div class="product">
<h3>চাল</h3>
<p>দাম: ৳৭০/কেজি</p>
</div>

<div class="product">
<h3>ডাল</h3>
<p>দাম: ৳১২০/কেজি</p>
</div>

<div class="product">
<h3>তেল</h3>
<p>দাম: ৳২০০/লিটার</p>
</div>

</section>
</body>
</html>
